<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Local research workspace for prediction-market bars, indicators and NautilusTrader backtests."
    />
    <title>Hermit Trading — Research Workspace</title>
    <script>
      // Apply the remembered theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem("htf.theme");
        if (t === "light") document.documentElement.classList.remove("dark");
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
